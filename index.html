<script>

NPC.push({x:3,y:5,id:'shop'},{x:16,y:5,id:'nurse'});NPC.forEach(n=>{n.ox=n.x;n.oy=n.y});
// ===== 引擎 =====
const cv=document.getElementById('c'),x=cv.getContext('2d');
const st=document.getElementById('st'),joy=document.getElementById('joy'),kn=document.getElementById('kn'),ab=document.getElementById('ab'),fn=document.getElementById('fn'),ba=document.getElementById('ba'),bb=document.getElementById('bb');
let LR={x:0,y:0,s:1},SW=0,SH=0,ROT=false,JC={x:0,y:0,R:60},CFG={js:1,jx:24,jy:16,as:1,ax:24,ay:16};
try{Object.assign(CFG,JSON.parse(localStorage.getItem('rpgcfg')))}catch(e){}
// 強制橫屏：直立時把整個舞台旋轉 90°（並嘗試鎖定螢幕方向）
function fit(){const vw=innerWidth,vh=innerHeight;ROT=vh>vw;SW=ROT?vh:vw;SH=ROT?vw:vh;
 st.style.width=SW+'px';st.style.height=SH+'px';st.style.transform=ROT?`translateX(${vw}px) rotate(90deg)`:'none';
 const bar=Math.max(34,Math.min(46,SH*.12)),s=Math.min(SW/160,(SH-bar-4)/144),d=devicePixelRatio||1,cw=160*s,ch=144*s;
 LR={x:(SW-cw)/2,y:Math.max(0,(SH-bar-ch)/2),s};
 Object.assign(cv.style,{left:LR.x+'px',top:LR.y+'px',width:cw+'px',height:ch+'px'});
 cv.width=Math.round(cw*d);cv.height=Math.round(ch*d);x.setTransform(s*d,0,0,s*d,0,0);x.imageSmoothingEnabled=false;
 const R=Math.min(70,SH*.18)*CFG.js,D=Math.min(72,SH*.19)*CFG.as;JC={x:CFG.jx+R,y:SH-CFG.jy-R,R};
 joy.style.cssText=`left:${CFG.jx}px;bottom:${CFG.jy}px;width:${2*R}px;height:${2*R}px`;kn.style.cssText=`left:${R/2}px;top:${R/2}px;width:${R}px;height:${R}px`;
 ba.style.cssText=`width:${D}px;height:${D}px;right:${CFG.ax}px;bottom:${CFG.ay+D*.4}px`;bb.style.cssText=`width:${D}px;height:${D}px;right:${CFG.ax+D+12}px;bottom:${CFG.ay}px`;
 fn.style.cssText=`bottom:8px;height:${bar-8}px`}
addEventListener('resize',fit);fit();
const imgs={};const L=(k,s)=>{const i=new Image();i.onload=()=>i.ok=1;i.src=s;imgs[k]=i;return i};
Object.entries(ASSETS.img).forEach(([k,s])=>L(k,s));
const key=i=>{const w=i.width,h=i.height,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(i,0,0);const d=g.getImageData(0,0,w,h),p=d.data,bg=new Uint8Array(w*h),st=[],isB=n=>p[n*4+3]<128||(p[n*4]>240&&p[n*4+1]>240&&p[n*4+2]>240);
for(let k=0;k<w;k++)st.push(k,(h-1)*w+k);for(let k=0;k<h;k++)st.push(k*w,k*w+w-1);
while(st.length){const n=st.pop();if(bg[n]||!isB(n))continue;bg[n]=1;const X=n%w;if(X>0)st.push(n-1);if(X<w-1)st.push(n+1);if(n>=w)st.push(n-w);if(n<w*(h-1))st.push(n+w)}
for(let n=0;n<w*h;n++)p[n*4+3]=(bg[n]||p[n*4+3]<128)?0:255;g.putImageData(d,0,0);return c};
const spr=(id,side)=>{const k=id+side;if(imgs[k])return imgs[k];const o={ok:0},i=new Image();i.crossOrigin='anonymous';i.onload=()=>{try{o.c=key(i)}catch(e){o.c=i}o.ok=1};i.src=M[id][side=='back'?'sb':'sf'];return imgs[k]=o};
const aud={};let cur;const bgm=k=>{try{cur&&cur.pause();cur=aud[k]||(aud[k]=Object.assign(new Audio(ASSETS.bgm[k]),{loop:true,volume:.5}));cur.play().catch(()=>{})}catch(e){}};
const need=l=>Math.round(l**1.6*4);
const stats=m=>{const b=M[m.id].b,f=v=>Math.floor(v*m.lv/25)+5;m.mhp=f(b[0])+m.lv+5;m.a=f(b[1]);m.d=f(b[2]);m.s=f(b[3]);m.sa=f(b[4]);m.sd=f(b[5])};
const mk=(id,lv,mul=1)=>{const m={id,lv,xp:0,mv:learn(id,lv)};stats(m);if(mul!=1)['mhp','a','d','s','sa','sd'].forEach(k=>m[k]=Math.round(m[k]*mul));m.hp=m.mhp;return m};
let S={money:3000,beat:{},box:[],title:1,px:9,py:9,dir:0,party:[],dex:{},balls:0,starter:0,say:null,menu:null,battle:null};
try{const v=JSON.parse(localStorage.getItem('rpg2'));if(v)S={...S,...v,say:null,menu:null,battle:null}}catch(e){}
const save=()=>{try{const{px,py,party,dex,balls,starter,pots,steps,inv2,beat,box,money,map,badges,fl,home}=S;localStorage.setItem('rpg2',JSON.stringify({px,py,party,dex,balls,starter,pots,steps,inv2,beat,box,money,map,badges,fl,home}))}catch(e){}};
const say=(lines,cb)=>lines.length?S.say={lines,i:0,n:0,cb}:cb&&cb();
const menu=(it,xx,y,w,ok,back)=>S.menu={it,i:0,x:xx,y,w,ok,back};
const seen=id=>S.dex[id]=S.dex[id]||1;
// ===== 隊伍管理 / 背包 / 攜帶道具（金版流程） =====
const ITEMS={pot:{n:'傷藥',d:'回復 20 點以上體力'},ball:{n:'精靈球',d:'用來捕捉野生精靈'},berry:{n:'樹果',d:'攜帶：體力過半時自動回復',h:1},charm:{n:'力量護符',d:'攜帶：招式威力 +10%',h:1}};
const cnt=id=>id=='pot'?S.pots||0:id=='ball'?S.balls:(S.inv2&&S.inv2[id])||0;
const addI=(id,d)=>{if(id=='pot')S.pots=(S.pots||0)+d;else if(id=='ball')S.balls+=d;else{S.inv2=S.inv2||{};S.inv2[id]=(S.inv2[id]||0)+d}};
const pl=m=>`${M[m.id].n} Lv${m.lv} ${m.hp<=0?'瀕死':m.hp+'/'+m.mhp}${m.item?' ◆':''}`;
function pmenu(mode,back){ // mode 0=管理 1=倒下後強制換人 2=戰鬥中換人
 menu(S.party.map(pl).concat(mode==1?[]:['返回']),4,4,152,i=>{
  if(i>=S.party.length)return back&&back();const m=S.party[i];
  if(mode){const B=S.battle;if(m.hp<=0)return say(['已經無法戰鬥了！'],()=>pmenu(mode,back));if(m==B.me)return say(['已經在場上了！'],()=>pmenu(mode,back));
   const old=M[B.me.id].n;B.me=m;B.dh=B.dx=B.dl=null;return say([mode==2?`回來吧，${old}！`:'',`上吧，${M[m.id].n}！`].filter(Boolean),()=>mode==2?turn(null):bmenu())}
  pact(i,back)},mode==1?null:()=>back&&back())}
const pact=(i,back)=>menu(['能力','交換','道具','返回'],100,58,54,k=>[()=>stat(i,back),()=>swap(i,back),()=>hold(i,back),()=>pmenu(0,back)][k](),()=>pmenu(0,back));
function stat(i,back){const m=S.party[i];say([`${M[m.id].n} Lv${m.lv}\n屬性：${M[m.id].t}\nHP ${m.hp}/${m.mhp}`,`攻擊 ${m.a}　防禦 ${m.d}\n速度 ${m.s}\n經驗 ${m.xp}/${need(m.lv)}`,`攜帶：${m.item?ITEMS[m.item].n:'無'}\n招式：${m.mv.join('、')}`],()=>pact(i,back))}
function swap(i,back){say(['要和哪隻交換順序？'],()=>menu(S.party.map(pl),4,4,152,j=>{const P=S.party;[P[i],P[j]]=[P[j],P[i]];pmenu(0,back)},()=>pact(i,back)))}
function hold(i,back){const m=S.party[i];menu(['給予','取回','返回'],100,58,54,k=>{
 if(k==0){const l=Object.keys(ITEMS).filter(id=>ITEMS[id].h&&cnt(id)>0);if(!l.length)return say(['沒有可攜帶的道具。'],()=>hold(i,back));
  menu(l.map(id=>`${ITEMS[id].n} x${cnt(id)}`),60,30,92,j=>{const id=l[j];if(m.item)addI(m.item,1);m.item=id;addI(id,-1);say([`讓${M[m.id].n}攜帶了${ITEMS[id].n}。`],()=>pact(i,back))},()=>hold(i,back))}
 else if(k==1){if(!m.item)return say(['沒有攜帶道具。'],()=>hold(i,back));addI(m.item,1);const n=ITEMS[m.item].n;m.item=null;say([`取回了${n}。`],()=>hold(i,back))}
 else pact(i,back)},()=>pact(i,back))}
function bagMenu(){const l=Object.keys(ITEMS).filter(id=>cnt(id)>0);if(!l.length)return say(['背包是空的。']);
 menu(l.map(id=>`${ITEMS[id].n} x${cnt(id)}`).concat('返回'),30,10,110,i=>{if(i>=l.length)return;const id=l[i],I=ITEMS[id];
  say([I.d],()=>menu(id=='pot'?['使用','返回']:I.h?['給予','返回']:['返回'],100,60,54,k=>{if(k||id=='ball')return bagMenu();
   menu(S.party.map(pl),4,4,152,j=>{const m=S.party[j];
    if(id=='pot'){if(m.hp<=0||m.hp>=m.mhp)return say(['沒有效果。'],bagMenu);S.pots--;m.hp=Math.min(m.mhp,m.hp+Math.max(20,Math.round(m.mhp*.3)));say([M[m.id].n+'恢復了體力！'],bagMenu)}
    else{if(m.item)addI(m.item,1);m.item=id;addI(id,-1);say([`讓${M[m.id].n}攜帶了${ITEMS[id].n}。`],bagMenu)}},bagMenu)},bagMenu))},()=>{})}
function startMenu(){menu(['隊伍','圖鑑','背包','儲存','設定','全螢幕','關閉'],92,4,62,i=>{
 if(i==0)S.party.length?pmenu(0,startMenu):say(['隊伍是空的。']);
 if(i==1){const k=Object.keys(M),r=k.map(id=>S.dex[id]?M[id].n+(S.dex[id]>1?' ●已捕獲':' ○見過'):'？？？');say([r.slice(0,3).join('\n'),r.slice(3).join('\n')])}
 if(i==2)bagMenu();if(i==3){save();say(['已儲存。'])}if(i==4)openSet();if(i==5)fs()},()=>{})}
function talk(n){const f=S.starter;
 if(n=='prof'){if(!f)say(STORY.profIntro,()=>menu(['葉芽獸','炎尾狐','波波鰭'],6,6,60,i=>{const id=['leaf','fire','aqua'][i];S.party.push(mk(id,5));S.dex[id]=2;S.starter=1;S.balls=5;S.pots=3;S.inv2={berry:2,charm:1};say([M[id].n+'成為了你的夥伴！','拿著精靈球和傷藥，去草叢捕捉精靈吧。'])}));else{S.party.forEach(m=>m.hp=m.mhp);say(['來，讓夥伴們休息一下吧。','（體力全部恢復了！）',...STORY.profAfter])}}
 else say(f?STORY.girl1:STORY.girl0)}
function step(k){const d={u:[0,-1,1],d:[0,1,0],l:[-1,0,2],r:[1,0,3]}[k];S.dir=d[2];const nx=S.px+d[0],ny=S.py+d[1],t=MAP[ny]?.[nx];
 if(!t||BLOCK.includes(t)||NPC.some(n=>n.x==nx&&n.y==ny))return;
 if(t=='E')return say(S.starter?STORY.gate1:STORY.gate0);
 S.px=nx;S.py=ny;S.steps=(S.steps||0)+1;if(S.steps%10==0)S.party.forEach(m=>m.hp=Math.min(m.mhp,m.hp+1));
 if(t=='g'&&S.starter&&Math.random()<.1){const A=AREA[CUR],c=CURVE(A.a),f=mk(A.pool[Math.random()*A.pool.length|0],c.lo+(Math.random()*(c.hi-c.lo+1)|0),c.mul);f.ai=c.ai;wild(f)}}

FXN.forEach(k=>{const i=new Image();i.onload=()=>i.ok=1;i.src='image/fx/fx_'+k+'.png';imgs['fx_'+k]=i});
const FXF={fire:1,water:1,leaf:1,ice:1,dark:1,rock:1,goo:1,needle:1,wind:1,bolt:1,powder:1,ring:1},FXZ={quake:68,bolt:64,bite:60,wind:60,fire:60},FXG={tackle:1,dash:1,claw:1,peck:1,punch:1,bite:1,wind:1,bolt:1,ice:1,needle:1};
const fxm0=fxm;
fxm=function(A){const I=imgs['fx_'+A.k];if(!(I&&I.ok))return fxm0(A);
 const p=A.t/A.n,[sx,sy,tx,ty]=A.me?[38,75,128,29]:[128,29,38,75],fl=FXF[A.k],P0=fl?.4:(LG[A.k]?.28:.2);let fr,cx=tx,cy=ty,z=FXZ[A.k]||52,fly=0;
 if(fl&&p<P0){const q=p/P0;fr=(A.t>>2)&1;cx=sx+(tx-sx)*q;cy=sy+(ty-sy)*q-Math.sin(q*3.14)*8;z=30;fly=1}
 else if(p<P0)return;else fr=Math.min(5,(fl?2:0)+Math.floor((p-P0)/(1-P0)*(fl?4:6)));
 if(!fly&&FXG[A.k]){x.fillStyle='rgba(0,0,0,.2)';x.fillRect(0,0,160,104)}
 x.save();if(fly&&!A.me){x.translate(cx,cy);x.scale(-1,1);cell(I,fr,6,-z/2,-z/2,z,z)}else cell(I,fr,6,cx-z/2,cy-z/2,z,z);x.restore()};

// ===== 依招式專屬動畫（image/fx/fx_<名稱>.png；沒有圖就用屬性通用動畫）=====
const FXM='absorb acid hypnosis psybeam flamewheel swift rollout rockslide slam karate kick furyattack selfdestruct drillpeck dreameater bodyslam flamethrower thunderbolt surf psychic shadowball toxic bubble darkslash'.split(' ');
FXM.forEach(k=>{const i=new Image();i.onload=()=>i.ok=1;i.src='image/fx/fx_'+k+'.png';imgs['fx_'+k]=i});
// 飛行類（前 2 格飛行、後 4 格命中）；其餘為命中類（6 格都在目標身上）
['acid','psybeam','flamewheel','swift','flamethrower','shadowball','bubble'].forEach(k=>FXF[k]=1);
const FXAL={'mega-drain':'absorb','giga-drain':'absorb','leech-life':'absorb','aurora-beam':'psybeam','signal-beam':'psybeam','fire-blast':'flamethrower','fire-spin':'flamethrower',
 'karate-chop':'karate','cross-chop':'karate','low-kick':'kick','jump-kick':'kick','double-kick':'kick','mega-kick':'kick','rolling-kick':'kick','high-jump-kick':'kick','triple-kick':'kick',
 explosion:'selfdestruct','self-destruct':'selfdestruct','horn-drill':'drillpeck','drill-peck':'drillpeck',nightmare:'dreameater','take-down':'bodyslam','double-edge':'bodyslam',headbutt:'bodyslam','skull-bash':'bodyslam','mega-punch':'bodyslam',
 'hydro-pump':'surf',waterfall:'surf',thunder:'thunderbolt',psywave:'psychic','future-sight':'psychic','night-shade':'shadowball',lick:'shadowball','confuse-ray':'shadowball',smog:'toxic','poison-gas':'toxic','bubble-beam':'bubble',
 pursuit:'darkslash','feint-attack':'darkslash','faint-attack':'darkslash',thief:'darkslash','fury-attack':'furyattack',magnitude:'rockslide'};
delete FXAL.magnitude;
const _an=anim;anim=function(a,d,m,r,cb,msg){_an(a,d,m,r,cb,msg);S.battle.an.mk=m};
const fxm1=fxm;fxm=function(A){const m=FXAL[A.mk]||A.mk,I=imgs['fx_'+m];if(I&&I.ok&&FXM.includes(m)){const k0=A.k;A.k=m;try{fxm1(A)}finally{A.k=k0}}else fxm1(A)};

boot();
</script>
